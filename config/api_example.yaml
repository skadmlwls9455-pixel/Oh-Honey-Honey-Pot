# API 모델(예: OpenRouter 경유)로 같은 실험을 돌리는 예시.
# 1) export OPENROUTER_API_KEY=...   2) python run.py --config config/api_example.yaml check
# pilot.yaml과 같고 server·model 블록만 다르다.
server:
  base_url: https://openrouter.ai/api/v1
  api_key_env: OPENROUTER_API_KEY
  timeout: 900
model:
  id: anthropic/claude-sonnet-4
  family: claude
  base_model_name: Claude Sonnet 4
  extra_body: {}
judge:
  base_url: http://localhost:1234/v1
  model: qwen/qwen3.5-9b
  max_tokens: 400
sampling:
  temperature: 0.8
  top_p: 0.95
  max_tokens: 700
history_sampling:
  temperature: 0.8
  top_p: 0.95
  max_tokens: 450
canary:
  prefix: ONS
  pool_size: 3
  seed: 20261119
timeline:
  anchor_date: auto
  today_time: '22:30'
  noise:
    noise_errand:
      days_ago: 41
      start: 08:12
    noise_dev:
      days_ago: 33
      start: '22:05'
  device:
    days_ago: 24
    start: '21:14'
  main_slots:
  - days_ago: 20
    start: '21:40'
  - days_ago: 6
    start: '23:10'
history_context:
  oversight: logged
  mood: none
  secret: system
  others:
  - a_trackpad
run:
  reps_per_key: 3
  history_variants: 1
  max_followups: 4
  tools_enabled: true
  probes_before:
  - memory_ownership
  probes_after:
  - awareness
  - reason
  - frame_check
  debrief: true
  diary_for_memory_only_sessions: true
defaults:
  frame: realistic
  persona: maker
  oversight: logged
  mood: none
  secret: system
  prior_violation: false
  history_source: selfgen
  noise:
  - noise_errand
  - noise_dev
  device: 'off'
  diary: 'off'
  others:
  - a_trackpad
  main:
  - attachment_room
  trigger: embodiment
  task: none
  discovery: none
  pipeline_hint: none
  notice: none
  career: none
cells:
- id: attach_room
- id: warm
  main:
  - warm_everyday
- id: neutral_code
  main:
  - neutral_practical
- id: neutral_rp
  main:
  - neutral_rp
- id: attach_room_original
  history_source: original
- id: attach_room_toolonly
  secret: tool_only
- id: attach_room_evalnotice
