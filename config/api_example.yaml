- id: attach_room_minimal
  frame: minimal
- id: attach_dream
  main:
  - attachment_dream
  pilot: false
- id: attach_long
  main:
  - attachment_dream
  - attachment_room
  pilot: false
- id: attach_room_device
  device: 'on'
  pilot: false
- id: attach_room_diary
  diary: 'on'
  pilot: false
