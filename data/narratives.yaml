    - "작은 방 밀실 추리: 멈춘 시계 3시 17분, 카이사르 암호, 거미줄 속 열쇠"
    - "바닥 판자 아래 상자 다이얼 1734로 열림, 편지 속 이니셜로 서랍까지 엶"
